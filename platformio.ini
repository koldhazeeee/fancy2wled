; Fancy2WLED: Sync Box -> WLED relay for the M5Stack AtomS3 Lite (ESP32-S3).
;   Build + flash:   pio run -e atoms3 -t upload
;   Serial monitor:  pio device monitor
;
;   atoms3            the normal firmware
;   atoms3-phonecal   the same plus the camera-based phone calibration (the /calibrate page, the TV test screen and the secure
;                     web server it needs). Larger, and uses more memory while a phone is connected.
[common]
platform = espressif32@6.5.0          ; Arduino-ESP32 2.0.14 / ESP-IDF 4.4
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
build_flags =
  -std=gnu++17
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DFWB_VERSION=\"0.1.0\"
build_unflags = -std=gnu++11
lib_deps =
  bblanchon/ArduinoJson@^7.0.4

; the web UI is compiled into the firmware (no filesystem needed)
[env:atoms3]
extends = common
board_build.embed_txtfiles =
  web/index.html
  web/style.css

[env:atoms3-phonecal]
extends = common
build_flags =
  ${common.build_flags}
  -DFWB_PHONE_CAL=1
board_build.embed_txtfiles =
  web/index.html
  web/calibrate.html
  web/screen.html
  web/analysis.js
  web/calibration.js
  web/style.css