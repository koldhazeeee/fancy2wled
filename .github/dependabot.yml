# Keeps the GitHub Actions used by the workflows up to date (a pull request when a new version is out). The firmware's own dependencies are pinned by hand
# in platformio.ini (PlatformIO, the ESP32 platform, ArduinoJson) because a new version must be tested on the board before it is taken.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CI"
    labels: ["dependencies"]
