name: ci
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: C++ core vs golden vectors
        run: python test/run_core_tests.py
      - name: Calibration maths + simulated camera
        run: node test/test_analysis.js
      - name: Capture / firmware-change tools
        run: python test/test_capture_tools.py
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install platformio
      - run: pio run -e atoms3
      - run: pio run -e atoms3-phonecal
      # the app images, ready for "Update firmware" on the setup page (see docs/OTA.md)
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/atoms3/firmware.bin
            .pio/build/atoms3-phonecal/firmware.bin
          if-no-files-found: error
